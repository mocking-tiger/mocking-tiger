name: Update D-Day Counter

on:
  schedule:
    # 매일 한국/일본 시간 기준 새벽 0시 (UTC 기준 15시)에 자동 실행
    - cron: '0 15 * * *'
  workflow_dispatch: # 버튼을 눌러서 수동으로 즉시 테스트해볼 수 있는 옵션

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Calculate D-Day & Update README
        run: |
          # 1. 일본 입국/시작 날짜 설정 (YYYY-MM-DD 형식으로 지정)
          # 예: 2026년 7월 25일이 D+1(첫날) 시작이라면 해당 날짜 입력
          START_DATE="2026-07-20"
          
          # 2. 오늘 날짜와 시작 날짜의 차이 계산 (일 수)
          CURRENT_DATE=$(date +%Y-%m-%d)
          START_SEC=$(date -d "$START_DATE" +%s)
          CURRENT_SEC=$(date -d "$CURRENT_DATE" +%s)
          
          DIFF_DAYS=$(( (CURRENT_SEC - START_SEC) / 86400 + 1 ))
          
          # 3. 대체할 텍스트 생성
          NEW_TEXT="**D+${DIFF_DAYS}**"
          
          # 4. README.md 파일 내의 주석 태그 사이 내용을 자동 교체
          sed -i "/<!-- dday-start -->/,/<!-- dday-end -->/c\<!-- dday-start -->\n${NEW_TEXT}\n<!-- dday-end -->" README.md

      - name: Commit & Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md
          git commit -m "chore: update D-day counter" || exit 0
          git push
