name: Update D-Day Counter

on:
  schedule:
    # 매일 한국/일본 시간 기준 새벽 0시 (UTC 기준 15시)에 자동 실행
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 워크플로우 차원에서 쓰기 권한 명시
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Calculate D-Day & Update README
        run: |
          START_DATE="2026-07-29"
          
          CURRENT_SEC=$(date -d "$(date +%Y-%m-%d)" +%s)
          START_SEC=$(date -d "$START_DATE" +%s)
          
          DIFF_DAYS=$(( (CURRENT_SEC - START_SEC) / 86400 ))
          
          if [ $DIFF_DAYS -lt 0 ]; then
            NEW_TEXT="**D${DIFF_DAYS}**"
          elif [ $DIFF_DAYS -eq 0 ]; then
            NEW_TEXT="**D-Day (D+1)**"
          else
            DAY_NUM=$(( DIFF_DAYS + 1 ))
            NEW_TEXT="**D+${DAY_NUM}**"
          fi
          
          echo "Calculated D-Day: $NEW_TEXT"
          
          # 파이썬으로 안전하게 README.md 수정
          python3 -c "
          import re, os
          
          new_text = '$NEW_TEXT'
          with open('README.md', 'r', encoding='utf-8') as f:
              content = f.read()
          
          pattern = r'<!-- dday-start -->.*?<!-- dday-end -->'
          replacement = f'<!-- dday-start -->\n{new_text}\n<!-- dday-end -->'
          
          new_content = re.sub(pattern, replacement, content, flags=re.DOTALL)
          
          with open('README.md', 'w', encoding='utf-8') as f:
              f.write(new_content)
          "

      - name: Commit & Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md
          git commit -m "chore: update D-day counter" || exit 0
          git push
