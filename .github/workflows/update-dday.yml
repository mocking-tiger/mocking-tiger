name: Update D-Day Counter

on:
  schedule:
    # 매일 한국/일본 시간 기준 새벽 0시 (UTC 기준 15시)에 자동 실행
    - cron: '0 15 * * *'
  workflow_dispatch: # 버튼을 눌러서 수동으로 즉시 테스트해볼 수 있는 옵션

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Calculate D-Day & Update README
        run: |
          START_DATE="2026-07-29"
          
          CURRENT_SEC=$(date -d "$(date +%Y-%m-%d)" +%s)
          START_SEC=$(date -d "$START_DATE" +%s)
          
          # 일 수 차이 계산
          DIFF_DAYS=$(( (CURRENT_SEC - START_SEC) / 86400 ))
          
          if [ $DIFF_DAYS -lt 0 ]; then
            # 시작일 전 (예: D-5)
            NEW_TEXT="**D${DIFF_DAYS}**"
          elif [ $DIFF_DAYS -eq 0 ]; then
            # 시작일 당일 (D-Day 또는 D+1)
            NEW_TEXT="**D-Day (D+1)**"
          else
            # 시작일 이후 (D+2, D+3 ...)
            DAY_NUM=$(( DIFF_DAYS + 1 ))
            NEW_TEXT="**D+${DAY_NUM}**"
          fi
          
          echo "Calculated D-Day: $NEW_TEXT"
          
          # python을 활용해 줄바꿈 및 태그 사이 내용 안전하게 교체
          python3 -c "
          with open('README.md', 'r', encoding='utf-8') as f:
              content = f.read()
          
          import re
          pattern = r'<!-- dday-start -->.*?<!-- dday-end -->'
          replacement = f'<!-- dday-start -->\n{'$NEW_TEXT'}\n<!-- dday-end -->'
          
          new_content = re.sub(pattern, replacement, content, flags=re.DOTALL)
          
          with open('README.md', 'w', encoding='utf-8') as f:
              f.write(new_content)
          "

      - name: Commit & Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md
          git commit -m "chore: update D-day counter" || exit 0
          git push
